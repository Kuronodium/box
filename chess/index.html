<title>White Chess Pieces</title>
<meta name="description" content="写真を元にしたチェス駒の3Dモデル（ポーン）">
<style>
  /* Layout: full-bleed seamless studio backdrop, one piece on a turntable, quiet labels at the edges.
     Single deliberate look (white photo studio), so no dark variant. */
  :root {
    --bg: #ededeb;
    --fg: #2a2a28;
    --muted: #7a7a76;
    --panel: #f7f7f5;
    --font-ui: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .caption {
    position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; gap: 2px; pointer-events: none;
  }
  .caption strong { font-size: 13px; font-weight: 400; letter-spacing: 0.12em; }
  .caption span { font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }
  .views {
    position: fixed; right: 16px; top: calc(16px + env(safe-area-inset-top, 0px));
    display: flex; gap: 2px; padding: 3px;
    background: var(--panel); border: 1px solid #dcdcd8;
  }
  .views button {
    font: inherit; font-size: 12px; letter-spacing: 0.06em; color: var(--muted); background: transparent;
    border: 0; padding: 6px 12px; cursor: pointer;
  }
  .views button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .views button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">

<div id="stage"></div>
<div class="views" role="group" aria-label="表示モード">
  <button type="button" id="view-solid" data-mode="solid" aria-pressed="true">ソリッド</button>
  <button type="button" id="view-wire" data-mode="wire" aria-pressed="false">ワイヤー</button>
  <button type="button" id="view-both" data-mode="both" aria-pressed="false">両方</button>
</div>
<div class="caption">
  <strong>PAWN</strong>
  <span>ドラッグで回転 / ホイール・ピンチで拡大縮小</span>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.6/build/index.module.js",
  "three-bvh-csg": "https://cdn.jsdelivr.net/npm/three-bvh-csg@0.0.16/build/index.module.js"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { Brush, Evaluator, SUBTRACTION } from "three-bvh-csg";

const stage = document.getElementById("stage");
const BG = 0xededeb;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
const camera = new THREE.PerspectiveCamera(22, 1, 0.1, 100);
camera.position.set(0, 1.5, 8.2);

// Lighting: large soft studio key from the front-left, gentle fill and top light
scene.add(new THREE.HemisphereLight(0xffffff, 0xb8b8b4, 1.3));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(-3, 5, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.radius = 10;
key.shadow.bias = -0.0002;
key.shadow.normalBias = 0.02;
key.shadow.camera.left = key.shadow.camera.bottom = -3;
key.shadow.camera.right = key.shadow.camera.top = 3;
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.6);
fill.position.set(4, 2, 3);
scene.add(fill);

// Seamless floor: only the shadow is drawn over the backdrop colour
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: 0.18 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// Soft contact shadow right under the piece
function contactShadow() {
  const c = document.createElement("canvas");
  c.width = c.height = 256;
  const ctx = c.getContext("2d");
  const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, "rgba(0,0,0,0.38)");
  g.addColorStop(0.45, "rgba(0,0,0,0.16)");
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 256);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 1.4),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
  m.rotation.x = -Math.PI / 2;
  m.position.y = 0.002;
  return m;
}
scene.add(contactShadow());

// Materials: plain matte white body, slightly glossier mask, dark recessed features
const stone = new THREE.MeshStandardMaterial({ color: 0xebebe8, roughness: 0.85, metalness: 0 });
const porcelain = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.35, metalness: 0 });
const ink = new THREE.MeshStandardMaterial({ color: 0x1c1c1c, roughness: 0.6, metalness: 0 });
const materials = [stone, porcelain, ink];

// Proportions are traced from the reference photo in pixels:
// y is measured down from the top of the crop. The hem sits at y = 191.2; the floor is set
// a little higher than in the photo (feet show 2/3 of the photo's height).
const PX = 2.2 / 192;
const FLOOR_Y = 200.4;
const toWorld = ([r, y]) => [r * PX, (FLOOR_Y - y) * PX];

function spline(points, samples) {
  const curve = new THREE.CatmullRomCurve3(points.map(([r, y]) => new THREE.Vector3(r, y, 0)), false, "centripetal");
  return curve.getPoints(samples).map((v) => [Math.max(0, v.x), v.y]);
}

function add(parent, geometry, material, { pos = [0, 0, 0], rot = [0, 0, 0], scale = [1, 1, 1] } = {}) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(...pos);
  mesh.rotation.set(...rot);
  mesh.scale.set(...scale);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

const csg = new Evaluator();
csg.useGroups = true;

// Round hooded head, built as a surface of revolution around the face axis (+z):
// sphere -> rounded lip -> inner wall -> floor. The lip fillet keeps the rim soft.
function hoodGeometry({ R, openR, lip, depth }) {
  const cR = openR + lip;                       // fillet centre, radial
  const cZ = Math.sqrt((R - lip) ** 2 - cR ** 2); // fillet centre, along the face axis
  const startA = Math.atan2(cZ, cR);             // where the fillet meets the sphere
  const pts = [];
  // Sphere from the back pole up to the fillet
  const sphereSteps = 72;
  for (let i = 0; i <= sphereSteps; i++) {
    const a = -Math.PI / 2 + (startA + Math.PI / 2) * (i / sphereSteps);
    pts.push(new THREE.Vector2(R * Math.cos(a), R * Math.sin(a)));
  }
  // Rounded lip rolling into the opening
  const lipSteps = 16;
  for (let i = 1; i <= lipSteps; i++) {
    const a = startA + (Math.PI - startA) * (i / lipSteps);
    pts.push(new THREE.Vector2(cR + lip * Math.cos(a), cZ + lip * Math.sin(a)));
  }
  // Inner wall and floor
  pts.push(new THREE.Vector2(openR, cZ - depth));
  pts.push(new THREE.Vector2(0, cZ - depth));
  const geo = new THREE.LatheGeometry(pts, 96);
  geo.rotateX(Math.PI / 2); // lathe axis y -> face axis z
  return { geo, rimZ: cZ };
}

// Mask: a gently domed disc with eyes and a nose line pressed into it
function maskMesh({ r, z0, bulge }) {
  const domeGeo = new THREE.SphereGeometry(1, 64, 48);
  domeGeo.scale(r, r, bulge);
  domeGeo.translate(0, 0, z0);
  const surfaceZ = (x, y) => z0 + bulge * Math.sqrt(Math.max(0, 1 - (x * x + y * y) / (r * r)));

  let result = new Brush(domeGeo, porcelain);
  const press = (geo) => {
    result.updateMatrixWorld();
    const tool = new Brush(geo, ink);
    tool.updateMatrixWorld();
    result = csg.evaluate(result, tool, SUBTRACTION);
  };
  const eyeR = 0.177 * r;
  for (const x of [-0.506 * r, 0.506 * r]) {
    const y = 0.063 * r;
    press(new THREE.SphereGeometry(eyeR, 24, 16).translate(x, y, surfaceZ(x, y) + eyeR * 0.45));
  }
  const noseR = 0.076 * r;
  const noseY = 0.02 * r;
  press(new THREE.CapsuleGeometry(noseR, 0.42 * r, 6, 12).translate(0, noseY, surfaceZ(0, noseY) + noseR * 0.2));

  const mesh = new THREE.Mesh(result.geometry, result.material);
  mesh.castShadow = mesh.receiveShadow = true;
  return mesh;
}

// Feet: two blocky feet. Only the toes peek out under the hem; the blocks run far back
// so the footprint sits under the centre of mass and a printed piece stands steadily.
function addFeet(parent, { spread, width, height, front, back }) {
  const depth = front + back;
  for (const s of [-1, 1]) {
    add(parent, new RoundedBoxGeometry(width, height, depth, 3, 0.035), stone, {
      pos: [s * spread, height / 2, (front - back) / 2],
    });
  }
}

// Shared hooded head used by every piece: a sphere with a soft-rimmed opening,
// a domed mask and recessed eyes and nose. All face proportions scale with R (world units).
// The pawn's values (R = 42px) are the reference look.
function makeHoodedHead(R) {
  const head = new THREE.Group();
  const k = R / 42;
  const { geo, rimZ } = hoodGeometry({ R, openR: 25 * k, lip: 3.5 * k, depth: 9 * k });
  add(head, geo, stone);
  head.add(maskMesh({ r: 23.7 * k, z0: rimZ - 5 * k, bulge: 10 * k }));
  return head;
}

function makePawn() {
  const g = new THREE.Group();

  // Head: a clean sphere (the photo's head is softened into a round one)
  const R = 42, headY = 54; // px
  // Neck: a straight column that rolls into the sphere through a concave fillet
  const neckR = 25, F = 8;
  const cR = neckR + F, cY = headY + Math.sqrt((R + F) ** 2 - cR ** 2);
  const a1 = Math.atan2(headY - cY, -cR);
  const fillet = [];
  for (let i = 0; i <= 16; i++) {
    const a = a1 + (-Math.PI - a1) * (i / 16);
    fillet.push([cR + F * Math.cos(a), cY + F * Math.sin(a)]);
  }
  const column = spline([[neckR, cY], [25.2, 108], [25.6, 120], [26.3, 130.6]], 30).slice(1);
  const neck = [...fillet, ...column];
  // Raised band: stands proud of both the neck and the top of the skirt, with slightly rounded edges
  const band = [[27, 131], [30.4, 131.3], [31.3, 132.2], [31.5, 137.5], [31.3, 142.8], [30.4, 143.7], [28.4, 144]];
  const skirt = spline([
    [28.6, 145], [30.5, 152], [33, 160], [36, 168], [39.5, 176], [42.5, 183], [43.8, 187], [43.6, 189.5], [42.6, 191],
  ], 40);
  const profile = [...neck, ...band, ...skirt, [30, 191.2], [0, 191.2]]
    .map(toWorld).map(([r, y]) => new THREE.Vector2(r, y))
    .reverse(); // lathe expects bottom-to-top so the faces point outward
  add(g, new THREE.LatheGeometry(profile, 96), stone);

  const head = makeHoodedHead(R * PX);
  head.position.y = (FLOOR_Y - headY) * PX;
  g.add(head);

  addFeet(g, { spread: 19.5 * PX, width: 20 * PX, height: 15 * PX, front: 26 * PX, back: 26 * PX });
  return g;
}

const piece = makePawn();
scene.add(piece);

// Wireframe overlay (edges of every mesh)
const wireMat = new THREE.LineBasicMaterial({ color: 0x2a2a28, transparent: true, opacity: 0.4 });
const wires = [];
piece.traverse((o) => {
  if (!o.isMesh) return;
  const w = new THREE.LineSegments(new THREE.WireframeGeometry(o.geometry), wireMat);
  w.visible = false;
  o.add(w);
  wires.push(w);
});

function setMode(mode) {
  for (const m of materials) m.visible = mode !== "wire";
  for (const w of wires) w.visible = mode !== "solid";
  document.querySelectorAll(".views button").forEach((b) => {
    b.setAttribute("aria-pressed", String(b.dataset.mode === mode));
  });
}
document.querySelectorAll(".views button").forEach((b) => {
  b.addEventListener("click", () => setMode(b.dataset.mode));
});

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.1, 0);
controls.enableDamping = true;
controls.minDistance = 2.5;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.49;
controls.autoRotate = !matchMedia("(prefers-reduced-motion: reduce)").matches;
controls.autoRotateSpeed = 0.6;
controls.addEventListener("start", () => { controls.autoRotate = false; });

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
